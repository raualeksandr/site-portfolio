# Amvera deploy config — static build via Node "browser" toolchain.
# Docs: https://docs.amvera.ru/applications/environments/nodejs-browser.html
#
# Runtime for this toolchain is a static nginx image (no Node at runtime),
# so no `run.command` / `containerPort` is needed — Amvera just serves the
# files listed under build.artifacts.
meta:
  environment: node
  toolchain:
    name: browser
    # Astro 7 requires Node >=22.12 — bumped from 20 after the first
    # Amvera build failed with "Node.js v20.20.2 is not supported by Astro!"
    version: 22

build:
  # Default build command for this toolchain is already
  # "npm install && npm run build" — no need to override it.
  artifacts:
    "dist/*": /
