# Amvera deploy config.
#
# D9 (see docs/arch-rules.md): switched from the "browser" toolchain
# (static nginx) to "Node.JS Server" running `sirv`. The browser
# toolchain's nginx only serves an EXACT file-path match and falls back
# to the root index.html for everything else (no directory-index
# resolution) — that turned our /en/ and /ru/ routes into an infinite
# redirect loop through the root's meta-refresh stub. `sirv` resolves
# directory index.html files correctly and 404s on truly missing paths.
# Docs: https://docs.amvera.ru/applications/environments/nodejs-server.html
meta:
  environment: node
  toolchain:
    name: npm
    version: 22

build:
  # Default build command for npm toolchain doesn't build automatically —
  # spelled out here to also run the Astro build after npm install.
  additionalCommands: npm run build

run:
  # package.json "start": "sirv dist --host 0.0.0.0 --port 3000 --etag"
  command: npm run start
  containerPort: 3000
